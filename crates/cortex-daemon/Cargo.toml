[package]
name = "cortex-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-core = { path = "../cortex-core" }
cortex-store = { path = "../cortex-store" }
cortex-embed = { path = "../cortex-embed" }
cortex-api = { path = "../cortex-api" }
cortex-plugin-fs = { path = "../../plugins/cortex-plugin-fs" }
tokio = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossbeam-channel = { workspace = true }
libc = "0.2"
tokio-stream = { version = "0.1", features = ["net"] }
hyper-util = { version = "0.1", features = ["tokio"] }
dirs = "6"
axum = "0.8"
